<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="style.css">
    <title>Tabelas</title>
</head>
<body>

    <table>

        <tfoot>
            <tr>
                <th>Total de pessoas</th>
                <td>0000</td>
            </tr>

    </table>

</html>
